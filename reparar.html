<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reparar Produção Rioplastic</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B2A4A;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#16283A;padding:20px;box-sizing:border-box}
    main{width:min(420px,100%);background:#fff;border-radius:18px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.35);text-align:center}
    h1{font-size:21px;margin:0 0 10px;color:#0B2A4A}p{line-height:1.5;color:#5C7186}button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:800;background:#00964D;color:#fff;cursor:pointer;width:100%}#st{font-size:13px;margin-top:12px}
  </style>
</head>
<body>
<main>
  <h1>🔧 Reparar aplicativo</h1>
  <p>Remove a versão quebrada e baixa novamente o app oficial.</p>
  <button id="btn">Limpar e abrir o aplicativo</button>
  <div id="st"></div>
</main>
<script>
async function reparar(){
  const st=document.getElementById('st');
  const btn=document.getElementById('btn');
  btn.disabled=true; st.textContent='Limpando cache e atualização antiga…';
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const nomes=await caches.keys();
      await Promise.all(nomes.map(n=>caches.delete(n)));
    }
    st.textContent='Pronto. Abrindo a versão nova…';
    setTimeout(()=>location.replace('./index.html?reparo='+Date.now()),500);
  }catch(e){
    st.textContent='Não foi possível limpar automaticamente: '+(e&&e.message?e.message:e);
    btn.disabled=false;
  }
}
document.getElementById('btn').addEventListener('click',reparar);
</script>
</body>
</html>
