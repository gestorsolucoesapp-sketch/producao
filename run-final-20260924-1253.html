<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><title>Executor único Iniflex</title><style>body{margin:0;padding:24px;background:#eef3f7;font-family:Arial;color:#0b3154}.box{max-width:920px;margin:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0002}#s{padding:12px;border-radius:10px;background:#fff4d6;font-weight:800;white-space:pre-line}.titulo-sec{font-size:18px;font-weight:800}.desc{font-size:13px;color:#607080}.btn{padding:10px 13px;border:0;border-radius:8px;font-weight:800}.btn-borda{background:#e9eef3}.btn-verde{background:#08783e;color:#fff}#iniflexApiCard{margin-top:14px}</style></head><body><main class="box"><h2>Executor único — fechamento 100%</h2><div id="s">Inicializando…</div><section id="iniflexApiCard"><div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div><div class="desc">Aguardando o conector v0.8.4…</div><div id="iniflexApiBody"></div></section></main><script>
(()=>{
 const ids=['005','010','002','304-PED','304-PROP'];
 const key='rio-final-unique-20260924-1253-v1';
 const box=document.getElementById('s');
 let st;try{st=JSON.parse(localStorage.getItem(key)||'null')}catch(_){st=null}
 if(!st||!Array.isArray(st.ids)||st.ids.join(',')!==ids.join(','))st={ids,index:0,phase:'prepare',at:0,done:[],tries:{},log:[]};
 const save=()=>localStorage.setItem(key,JSON.stringify(st));
 const cur=()=>st.ids[st.index]||null;
 const out=()=>String(document.getElementById('rioOut')?.textContent||'').replace(/\s+/g,' ').trim();
 const prep=()=>[...document.querySelectorAll('#iniflexApiBody *')].map(e=>String(e.textContent||'').replace(/\s+/g,' ').trim()).find(t=>/preparado no Iniflex/i.test(t))||'';
 const button=id=>document.querySelector('.rioOne[data-id="'+CSS.escape(id)+'"]');
 const set=t=>box.textContent=t;
 const persist=(msg='')=>{if(msg)st.log.push({at:new Date().toISOString(),msg:String(msg).slice(0,1000)});st.log=st.log.slice(-40);save()};
 const reload=(ms=1200)=>setTimeout(()=>location.reload(),ms);
 function matches(id,text){const t=String(text||'').toUpperCase();if(t.includes(id))return true;if(id==='304-PED')return t.includes('304')&&t.includes('PEDIDO');if(id==='304-PROP')return t.includes('304')&&t.includes('PROPOSTA');return false}
 function retry(id,msg){st.tries[id]=(st.tries[id]||0)+1;st.phase='prepare';st.at=0;persist(id+' retry '+st.tries[id]+' '+msg);set('⚠️ '+id+' não concluiu. Tentativa automática '+st.tries[id]+'.\n'+msg);reload(Math.min(20000,3000+st.tries[id]*1500))}
 function next(id){if(!st.done.includes(id))st.done.push(id);st.index++;st.phase='prepare';st.at=0;persist(id+' concluído');set('✅ '+id+' concluído. Avançando…');reload(1200)}
 function tick(){
   const id=cur();if(!id){set('✅ 100% DA SEQUÊNCIA CONCLUÍDA: '+st.done.join(' → '));persist('100% concluído');return}
   const o=out(),p=prep(),proc=document.getElementById('rioProcessPrepared'),cancel=document.getElementById('rioCancelPrepared'),elapsed=Date.now()-(st.at||0);
   if(/Extension context invalidated|Conector reiniciou/i.test(o)){set('🔄 Reconectando o conector…');reload(1300);return}
   if(st.phase==='prepare'){
     if(proc){if(matches(id,p)){st.phase='process';st.at=Date.now();persist(id+' process');set('✅ '+id+' preparado e validado. Acionando Processar…');proc.click();return}if(cancel){set('Limpando preparação anterior…');cancel.click();reload(1700);return}}
     const b=button(id);if(b&&!b.disabled){st.phase='waiting';st.at=Date.now();persist(id+' prepare');set('⏳ Preparando '+id+' ('+(st.index+1)+'/5) no Iniflex…');b.click();reload(3000);return}
     set('Aguardando o conector v0.8.4 disponibilizar '+id+'…');if(elapsed>18000)reload(1200);return
   }
   if(st.phase==='waiting'){
     if(proc&&matches(id,p)){st.phase='process';st.at=Date.now();persist(id+' validated');set('✅ '+id+' validado. Acionando Processar…');proc.click();return}
     if(/^(⚠️|❌)|não foi possível|falha|erro|rejeitou|bloqueou/i.test(o)&&elapsed>6000){retry(id,o);return}
     set('⏳ A extensão está preparando '+id+' na tela do Iniflex…\n'+o);
     if(elapsed>45000){st.phase='prepare';st.at=0;persist(id+' preparation timeout');reload(1500)}return
   }
   if(st.phase==='process'){
     set('⏳ '+id+' está gerando, enviando e importando. Não feche o Iniflex.\n'+o);
     if(/Comando concluído|Última execução:\s*1\/1 concluíd/i.test(o)&&elapsed>3000){next(id);return}
     if(/^(⚠️|❌)|não foi possível|falha|erro|rejeitou|bloqueou|divergente/i.test(o)&&elapsed>7000){retry(id,o);return}
     if(elapsed>50*60*1000){retry(id,'tempo limite de 50 minutos');return}
   }
 }
 persist('executor aberto');setInterval(tick,1000);tick();
})();
</script></body></html>
