name: Aplicar v4.638.40

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.40.yml'
      - '.github/scripts/aplicar-v4.638.40.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converter pedido de compra para kg
        run: |
          python .github/scripts/aplicar-v4.638.40.py
          git diff --check
          grep -q "Solicito a compra do fornecedor" index.html
          grep -q "CÓDIGO DA TINTA | COR | QUANTIDADE (KG)" index.html
          grep -q "Total geral:" index.html
          grep -q "const APP_VER = '4.638.40'" index.html

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.40 - pedido de compra enviado em kg"
          git push origin HEAD:main
