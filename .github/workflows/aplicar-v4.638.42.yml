name: Aplicar v4.638.42

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.42.yml'
      - '.github/scripts/aplicar-v4.638.42.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar copia rica do pedido
        run: |
          python .github/scripts/aplicar-v4.638.42.py
          git diff --check
          grep -q "ClipboardItem" index.html
          grep -q "Pedido copiado com formulário azul e branco" index.html
          grep -q "background:#eaf3fb" index.html
          grep -q "const APP_VER = '4.638.42'" index.html

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.42 - copia pedido com faixas azul branco"
          git push origin HEAD:main
