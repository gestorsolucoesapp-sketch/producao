name: Aplicar v4.638.20

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reverter ajuste dos icones e estabilizar app
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          for tag in [
              '<script src="./ui-header-v4.638.18.js?v=4.638.18"></script>',
              '<script src="./ui-header-v4.638.19.js?v=4.638.19"></script>',
          ]:
              s = s.replace(tag + '\n', '').replace(tag, '')

          s = s.replace('v4.638.19<small id="verData"', 'v4.638.20<small id="verData"')
          s = s.replace('v4.638.18<small id="verData"', 'v4.638.20<small id="verData"')
          s = s.replace("const APP_VER = '4.638.19';", "const APP_VER = '4.638.20';")
          s = s.replace("const APP_VER = '4.638.18';", "const APP_VER = '4.638.20';")

          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          ! grep -q "ui-header-v4.638.18.js" index.html
          ! grep -q "ui-header-v4.638.19.js" index.html
          grep -q "const APP_VER = '4.638.20'" index.html
          grep -q "producao-rioplastic-v4.638.20" sw.js

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "v4.638.20 - reverte ajuste dos icones e restaura estabilidade"
          git push origin HEAD:main
