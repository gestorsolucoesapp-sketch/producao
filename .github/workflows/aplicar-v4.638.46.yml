name: Aplicar v4.638.46

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.46.yml'
      - '.github/scripts/aplicar-v4.638.46.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reparar script e aplicar v4.638.46
        run: |
          python .github/scripts/aplicar-v4.638.46.py
          git diff --check
          test "$(grep -o 'iniflex-portal-v4.638.46.js?v=4.638.46' index.html | wc -l)" -eq 1
          grep -q "const APP_VER = '4.638.46'" index.html
          grep -q "producao-rioplastic-v4.638.46" sw.js
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.46 - corrige encerramento prematuro do JavaScript"
          git push origin HEAD:main
