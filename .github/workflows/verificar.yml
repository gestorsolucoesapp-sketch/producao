# Verificação automática antes de publicar — criado em 04/08/2026.
# Roda a cada alteração do index.html, do app.js ou do sw.js e reprova o commit
# quando encontra um problema que já foi ao ar em produção alguma vez.
name: Verificar app

on:
  push:
    # 21/08/2026: app.js e check.js entraram na lista. O JS do app saiu do
    # index.html e mora no app.js agora — sem isto, uma alteração feita só nele
    # subiria sem passar por verificação nenhuma. E mudar o check.js sem rodá-lo
    # deixava o próprio verificador quebrado sem ninguém ver.
    paths: ['index.html', 'app.js', 'sw.js', '.github/workflows/verificar.yml', '.github/scripts/check.js']
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar analisador
        run: npm install --no-save acorn acorn-walk
      - name: Conferir o app
        run: node .github/scripts/check.js
