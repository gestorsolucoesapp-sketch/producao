# Verificação automática antes de publicar — criado em 04/08/2026.
# Roda a cada alteração do index.html ou do sw.js e reprova o commit quando
# encontra um problema que já foi ao ar em produção alguma vez.
name: Verificar app

on:
  push:
    paths: ['index.html', 'sw.js', '.github/workflows/verificar.yml']
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar analisador
        run: npm install --no-save acorn acorn-walk
      - name: Conferir o app
        run: node .github/scripts/check.js
