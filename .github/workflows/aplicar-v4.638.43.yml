name: Aplicar v4.638.43

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.43.yml'
      - '.github/scripts/aplicar-v4.638.43.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar integracao direta Iniflex
        run: |
          python .github/scripts/aplicar-v4.638.43.py
          git diff --check
          grep -q "Integração direta Iniflex" index.html
          grep -q "functions/v1/iniflex-sync" index.html
          grep -q "const APP_VER = '4.638.43'" index.html
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.43 - integracao direta Iniflex"
          git push origin HEAD:main
