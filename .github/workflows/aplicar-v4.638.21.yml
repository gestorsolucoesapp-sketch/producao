name: Aplicar v4.638.21

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.21.yml'
      - '.github/scripts/apply-v4.638.21.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python .github/scripts/apply-v4.638.21.py

      - name: Validar
        run: |
          git diff --check
          grep -q "const APP_VER = '4.638.21'" index.html
          grep -q "LOGO_STRATWS_NEGATIVO-02.png" index.html
          grep -q "#EEF3F1" nav-config-v4.638.17.js
          grep -q "producao-rioplastic-v4.638.21" sw.js
          ! grep -q 'ui-header-v4.638.18.js' index.html

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html nav-config-v4.638.17.js sw.js
          git commit -m "v4.638.21 - cabecalho setores e navegacao"
          git push origin HEAD:main
