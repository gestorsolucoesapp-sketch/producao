name: Aplicar v4.638.13

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.13.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar navegacao por blocos e central Stratws
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./stratws-nav-v4.638.13.js?v=4.638.13"></script>'

          if tag not in s:
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('index.html sem </body> final')
              s = s[:pos] + tag + '\n' + s[pos:]

          s = s.replace("v4.638.12<small id=\"verData\"", "v4.638.13<small id=\"verData\"")
          s = s.replace("const APP_VER = '4.638.12';", "const APP_VER = '4.638.13';")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace("v4.638.12", "v4.638.13")
          w = w.replace("producao-rioplastic-v4.638.12", "producao-rioplastic-v4.638.13")
          sw.write_text(w, encoding='utf-8')
          PY

          git diff --check
          grep -q "stratws-nav-v4.638.13.js" index.html
          grep -q "const APP_VER = '4.638.13'" index.html
          grep -q "producao-rioplastic-v4.638.13" sw.js

      - name: Publicar alteracao
        run: |
          if git diff --quiet; then
            echo "Nada para publicar"
            exit 0
          fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.13 - central Stratws e navegacao por blocos"
          git push origin HEAD:main
