name: Aplicar v4.638.18

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expor atalhos no cabecalho
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tag = '<script src="./ui-header-v4.638.18.js?v=4.638.18"></script>'
          if tag not in s:
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('index.html sem </body>')
              s = s[:pos] + tag + '\n' + s[pos:]

          s = s.replace('v4.638.17<small id="verData"', 'v4.638.18<small id="verData"')
          s = s.replace("const APP_VER = '4.638.17';", "const APP_VER = '4.638.18';")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('v4.638.17', 'v4.638.18')
          w = w.replace('producao-rioplastic-v4.638.17', 'producao-rioplastic-v4.638.18')
          sw.write_text(w, encoding='utf-8')
          PY

          node --check ui-header-v4.638.18.js
          git diff --check
          grep -q "ui-header-v4.638.18.js?v=4.638.18" index.html
          grep -q "const APP_VER = '4.638.18'" index.html
          grep -q "producao-rioplastic-v4.638.18" sw.js

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.18 - atalhos visiveis no cabecalho"
          git push origin HEAD:main
