name: Aplicar v4.638.15

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar áreas configuráveis e reposicionar letreiro
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./nav-config-v4.638.15.js?v=4.638.15"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('index.html sem </body>')
              s=s[:pos]+tag+'\n'+s[pos:]
          s=s.replace("v4.638.14<small id=\"verData\"", "v4.638.15<small id=\"verData\"")
          s=s.replace("const APP_VER = '4.638.14';", "const APP_VER = '4.638.15';")
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace("v4.638.14","v4.638.15")
          w=w.replace("producao-rioplastic-v4.638.14","producao-rioplastic-v4.638.15")
          sw.write_text(w,encoding='utf-8')
          PY
          git diff --check
          grep -q "nav-config-v4.638.15.js" index.html
          grep -q "const APP_VER = '4.638.15'" index.html
          grep -q "producao-rioplastic-v4.638.15" sw.js
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.15 - areas configuraveis e letreiro no topo"
          git push origin HEAD:main
