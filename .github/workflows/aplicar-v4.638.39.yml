name: Aplicar v4.638.39

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.39.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir valor da Compra por kg
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label):
              n=text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: esperado 1, encontrado {n}')
              return text.replace(old,new,1)

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=rep(
              s,
              "const totRS = itens.reduce((a, x) => a + x.q * (+x.p.preco || 0), 0);",
              "const totRS = itens.reduce((a, x) => a + x.q * (+x.p.peso_lata_kg || 0) * (+x.p.preco || 0), 0);",
              'total estimado compra'
          )

          s=rep(
              s,
              "(_tintaVeDinheiro() ? '<td style=\"text-align:right\">' + (x.p.preco ? _tBRL(x.q * x.p.preco) : '—') + '</td>' : '')",
              "(_tintaVeDinheiro() ? '<td style=\"text-align:right\">' + (x.p.preco && x.p.peso_lata_kg ? _tBRL(x.q * x.p.peso_lata_kg * x.p.preco) : '—') + '</td>' : '')",
              'valor por item compra'
          )

          s=rep(
              s,
              "_tBRL(itens.reduce((a, x) => a + x.q * (+x.p.preco || 0), 0))",
              "_tBRL(itens.reduce((a, x) => a + x.q * (+x.p.peso_lata_kg || 0) * (+x.p.preco || 0), 0))",
              'rodape estimativa compra'
          )

          s=rep(
              s,
              '<div class="desc" style="font-size:11px">estimativa</div>',
              '<div class="desc" style="font-size:11px">estimativa · preço por kg</div>',
              'rotulo estimativa'
          )

          s=rep(s, '>v4.638.38<small id="verData"', '>v4.638.39<small id="verData"', 'badge')
          s=rep(s, "const APP_VER = '4.638.38';", "const APP_VER = '4.638.39';", 'APP_VER')
          s=rep(s,
              '<script src="./tinta-nfe-v4.638.22.js?v=4.638.38"></script>',
              '<script src="./tinta-nfe-v4.638.22.js?v=4.638.39"></script>',
              'script NF-e')
          s=rep(s,
              '<script src="./tinta-balanco-historico-v4.638.30.js?v=4.638.38"></script>',
              '<script src="./tinta-balanco-historico-v4.638.30.js?v=4.638.39"></script>',
              'script balanço')
          s=rep(s,
              '<script src="./tinta-saida-sugestoes-v4.638.32.js?v=4.638.38"></script>',
              '<script src="./tinta-saida-sugestoes-v4.638.32.js?v=4.638.39"></script>',
              'script saída')

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=rep(w, '// Produção Rioplastic — v4.638.38', '// Produção Rioplastic — v4.638.39', 'sw versão')
          w=rep(w, "const CACHE = 'producao-rioplastic-v4.638.38';", "const CACHE = 'producao-rioplastic-v4.638.39';", 'sw cache')
          sw.write_text(w,encoding='utf-8')
          PY

          git diff --check
          grep -q "x.q \* (+x.p.peso_lata_kg || 0) \* (+x.p.preco || 0)" index.html
          grep -q "estimativa · preço por kg" index.html
          grep -q "const APP_VER = '4.638.39'" index.html

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.39 - corrige compra para preco por kg"
          git push origin HEAD:main
