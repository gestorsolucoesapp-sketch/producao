name: Aplicar v4.638.19

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remover loop do cabecalho
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<script src="./ui-header-v4.638.18.js?v=4.638.18"></script>',
              '<script src="./ui-header-v4.638.19.js?v=4.638.19"></script>'
          )
          s = s.replace('v4.638.18<small id="verData"', 'v4.638.19<small id="verData"')
          s = s.replace("const APP_VER = '4.638.18';", "const APP_VER = '4.638.19';")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('v4.638.18', 'v4.638.19')
          w = w.replace('producao-rioplastic-v4.638.18', 'producao-rioplastic-v4.638.19')
          sw.write_text(w, encoding='utf-8')
          PY

          node --check ui-header-v4.638.19.js
          git diff --check
          grep -q "ui-header-v4.638.19.js?v=4.638.19" index.html
          ! grep -q "ui-header-v4.638.18.js?v=4.638.18" index.html
          grep -q "const APP_VER = '4.638.19'" index.html
          grep -q "producao-rioplastic-v4.638.19" sw.js

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.19 - corrige travamento do cabecalho"
          git push origin HEAD:main
