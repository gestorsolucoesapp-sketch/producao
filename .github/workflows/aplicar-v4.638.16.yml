name: Aplicar v4.638.16

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ligar painel real do Stratws
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          tag = '<script src="./stratws-live-v4.638.16.js?v=4.638.16"></script>'
          if tag not in s:
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('index.html sem </body>')
              s = s[:pos] + tag + '\n' + s[pos:]

          s = s.replace('v4.638.15<small id="verData"', 'v4.638.16<small id="verData"')
          s = s.replace("const APP_VER = '4.638.15';", "const APP_VER = '4.638.16';")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('v4.638.15', 'v4.638.16')
          w = w.replace('producao-rioplastic-v4.638.15', 'producao-rioplastic-v4.638.16')
          sw.write_text(w, encoding='utf-8')
          PY

          git diff --check
          grep -q "stratws-live-v4.638.16.js" index.html
          grep -q "const APP_VER = '4.638.16'" index.html
          grep -q "producao-rioplastic-v4.638.16" sw.js

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.16 - integra painel real do Stratws"
          git push origin HEAD:main
