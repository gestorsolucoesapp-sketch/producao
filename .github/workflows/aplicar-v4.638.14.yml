name: Aplicar v4.638.14

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar menu compacto
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./compact-nav-v4.638.14.js?v=4.638.14"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos<0: raise SystemExit('index.html sem </body>')
              s=s[:pos]+tag+'\n'+s[pos:]
          s=s.replace("v4.638.13<small id=\"verData\"", "v4.638.14<small id=\"verData\"")
          s=s.replace("const APP_VER = '4.638.13';", "const APP_VER = '4.638.14';")
          p.write_text(s,encoding='utf-8')
          sw=Path('sw.js')
          w=sw.read_text(encoding='utf-8')
          w=w.replace("v4.638.13","v4.638.14")
          w=w.replace("producao-rioplastic-v4.638.13","producao-rioplastic-v4.638.14")
          sw.write_text(w,encoding='utf-8')
          PY
          git diff --check
          grep -q "compact-nav-v4.638.14.js" index.html
          grep -q "const APP_VER = '4.638.14'" index.html
          grep -q "producao-rioplastic-v4.638.14" sw.js
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.14 - menu de areas compacto"
          git push origin HEAD:main
