name: Aplicar v4.638.45

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.45.yml'
      - '.github/scripts/aplicar-v4.638.45.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar sessao portal Iniflex
        run: |
          python .github/scripts/aplicar-v4.638.45.py
          git diff --check
          grep -q "const APP_VER = '4.638.45'" index.html
          grep -q "iniflex-portal-v4.638.45.js" index.html
          grep -q "producao-rioplastic-v4.638.45" sw.js
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.45 - sessao segura do portal Iniflex"
          git push origin HEAD:main
