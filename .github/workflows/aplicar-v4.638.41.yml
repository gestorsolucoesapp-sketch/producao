name: Aplicar v4.638.41

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.41.yml'
      - '.github/scripts/aplicar-v4.638.41.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar formatação do pedido
        run: |
          python .github/scripts/aplicar-v4.638.41.py
          git diff --check
          grep -q "QUANTIDADE'.padStart" index.html
          grep -q "tbody tr:nth-child(even){background:#eaf3fb}" index.html
          grep -q "td.kg,th.kg" index.html
          grep -q "const APP_VER = '4.638.41'" index.html

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.41 - alinha kg e formulario azul branco no pedido"
          git push origin HEAD:main
