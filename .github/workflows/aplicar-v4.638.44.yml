name: Aplicar v4.638.44

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.44.yml'
      - '.github/scripts/aplicar-v4.638.44.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar bump v4.638.44
        run: |
          python .github/scripts/aplicar-v4.638.44.py
          git diff --check
          grep -q "const APP_VER = '4.638.44'" index.html
          grep -q "v4.638.44<small id=\"verData\"" index.html
          grep -q "producao-rioplastic-v4.638.44" sw.js
      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.44 - 1806 e deteccao automatica de maquinas"
          git push origin HEAD:main
