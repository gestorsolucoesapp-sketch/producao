name: Aplicar v4.638.17

on:
  push:
    paths:
      - '.github/workflows/aplicar-v4.638.17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Corrigir areas e letreiro
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              '<script src="./nav-config-v4.638.15.js?v=4.638.15"></script>',
              '<script src="./nav-config-v4.638.17.js?v=4.638.17"></script>'
          )
          s = s.replace('v4.638.16<small id="verData"', 'v4.638.17<small id="verData"')
          s = s.replace("const APP_VER = '4.638.16';", "const APP_VER = '4.638.17';")
          p.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = w.replace('v4.638.16', 'v4.638.17')
          w = w.replace('producao-rioplastic-v4.638.16', 'producao-rioplastic-v4.638.17')
          sw.write_text(w, encoding='utf-8')
          PY

          node --check nav-config-v4.638.17.js
          git diff --check
          grep -q "nav-config-v4.638.17.js?v=4.638.17" index.html
          grep -q "const APP_VER = '4.638.17'" index.html
          ! grep -q "nav-config-v4.638.15.js?v=4.638.15" index.html
          grep -q "producao-rioplastic-v4.638.17" sw.js

      - name: Publicar
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "Rioplastic Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "v4.638.17 - corrige areas e posicao do letreiro"
          git push origin HEAD:main
