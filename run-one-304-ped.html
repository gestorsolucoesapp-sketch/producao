<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste controlado 304-PED</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f7;color:#0b3154;margin:0;padding:24px}.box{max-width:760px;margin:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0002}.titulo-sec{font-size:20px;font-weight:800}.desc{font-size:13px;color:#607080;margin-top:5px}#launcherStatus{margin-top:14px;padding:12px;border-radius:10px;background:#fff4d6;font-weight:700}#iniflexApiCard{margin-top:16px;border-top:1px solid #d8e1e8;padding-top:14px}.btn{padding:9px 12px;border:0;border-radius:8px;font-weight:700}.btn-borda{background:#e9eef3;color:#0b3154}.btn-verde{background:#08783e;color:#fff}
</style>
</head>
<body>
<div class="box">
  <div class="titulo-sec">Teste controlado do RVEN304 · Pedido</div>
  <div class="desc">Esta página inicia somente o relatório 304-PED para acompanhar o preenchimento diretamente na tela do Iniflex.</div>
  <div id="launcherStatus">Aguardando o conector v0.8.1 carregar…</div>
  <div id="iniflexApiCard"><div id="iniflexApiBody"></div></div>
</div>
<script>
(()=>{
  const status=document.getElementById('launcherStatus');
  const startedKey='rio-304-ped-started-'+new URLSearchParams(location.search).get('nonce');
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    const btn=document.querySelector('.rioOne[data-id="304-PED"]');
    if(btn){
      clearInterval(timer);
      if(sessionStorage.getItem(startedKey)==='1'){
        status.textContent='O 304-PED já foi solicitado nesta página. Acompanhe a janela do Iniflex.';
        status.style.background='#e7f7ee';
        return;
      }
      sessionStorage.setItem(startedKey,'1');
      status.textContent='Iniciando somente o 304-PED agora. Acompanhe a tela do Iniflex.';
      status.style.background='#e7f7ee';
      btn.click();
      return;
    }
    if(tries>80){
      clearInterval(timer);
      status.textContent='O botão 304-PED não apareceu. Verifique se a extensão v0.8.1 está ativa.';
      status.style.background='#ffe3e3';
    }
  },250);
})();
</script>
</body>
</html>
