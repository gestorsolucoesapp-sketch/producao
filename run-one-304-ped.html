<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Executar 304-PED</title><style>body{font-family:Arial;background:#eef3f7;color:#0b3154;padding:24px}.box{max-width:800px;margin:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px #0002}.titulo-sec{font-size:20px;font-weight:800}.desc{font-size:13px;color:#607080}#launcherStatus{margin:14px 0;padding:12px;border-radius:10px;background:#fff4d6;font-weight:800}.btn{padding:9px 12px;border:0;border-radius:8px;font-weight:700}.btn-borda{background:#e9eef3}.btn-verde{background:#08783e;color:#fff}</style></head><body><div class="box"><div class="titulo-sec">RVEN304 · Pedido</div><div class="desc">Prepara, valida, processa, envia e importa somente o 304-PED.</div><div id="launcherStatus">Aguardando o conector v0.8.4…</div><section id="iniflexApiCard"><div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div><div class="desc">Aguardando a extensão…</div><span id="iniflexApiBadge"></span><div id="iniflexApiBody"></div></section></div><script>
(()=>{const st=document.getElementById('launcherStatus');let lastPrepare=0,lastProcess=0,reloading=false;function tick(){try{const now=Date.now(),body=document.body.innerText||'',out=String(document.getElementById('rioOut')?.textContent||''),btn=document.querySelector('.rioOne[data-id="304-PED"]'),process=document.getElementById('rioProcessPrepared');if(/Última execução:\s*1\/1 concluídos/i.test(out)||/Comando concluído/i.test(out)){st.textContent='✅ 304-PED concluído e importado.';st.style.background='#e7f7ee';return}if(/Conector reiniciou|Extension context invalidated/i.test(out)){if(!reloading){reloading=true;st.textContent='🔄 O worker reiniciou. Recarregando e retomando…';setTimeout(()=>location.reload(),1800)}return}if(/❌|não foi possível|falha no importador/i.test(out)){st.textContent='⚠️ '+out;st.style.background='#ffe3e3';return}if(process&&now-lastProcess>7000){lastProcess=now;st.textContent='✅ Preparação localizada. Acionando Processar…';process.click();return}if(body.includes('v0.8.4')&&btn&&now-lastPrepare>9000){lastPrepare=now;st.textContent='⏳ Preparando exclusivamente o 304-PED…';btn.click();return}st.textContent=process?'⏳ Aguardando o Processar responder…':'⏳ Aguardando preparação/geração do 304-PED…'}catch(e){st.textContent='Erro: '+e.message}}setInterval(tick,1000);tick()})();
</script></body></html>
