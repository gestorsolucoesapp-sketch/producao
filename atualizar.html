<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate,max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Atualizando Produção Rioplastic</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3f7;color:#0b2a4a;margin:0;display:grid;place-items:center;min-height:100vh}
.box{background:#fff;border-radius:16px;padding:24px;max-width:520px;box-shadow:0 8px 30px #0002;text-align:center}
h2{margin:0 0 10px}.s{color:#607080}
</style>
</head>
<body><div class="box"><h2>Atualizando Produção Rioplastic</h2><div id="s" class="s">Limpando somente o cache visual antigo…</div></div>
<script>
(async()=>{
  const s=document.getElementById('s');
  try{
    for(const storage of [localStorage,sessionStorage]){
      for(let i=storage.length-1;i>=0;i--){
        const k=storage.key(i);
        if(k && /monitor|modo[-_ ]?monitor/i.test(k)) storage.removeItem(k);
      }
    }
  }catch(_){}
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(_){}
  try{
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(k=>caches.delete(k)));
    }
  }catch(_){}
  s.textContent='Cache antigo removido. Abrindo a versão padrão…';
  setTimeout(()=>location.replace('./?v=4.638.53&ui=padrao&fresh='+Date.now()),700);
})();
</script></body></html>
