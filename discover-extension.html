<!doctype html><meta charset="utf-8"><title>Descobrir extensão</title><pre id="out">carregando...</pre><script>
setTimeout(()=>{
 const vals=[];
 for(const e of performance.getEntriesByType('resource')) vals.push(e.name);
 for(const s of document.scripts) vals.push('SCRIPT:'+s.src);
 vals.push('STACK:'+new Error().stack);
 document.getElementById('out').textContent=[...new Set(vals)].filter(Boolean).join('\n');
},2500);
</script><div id="iniflexApiCard"><div class="titulo-sec">Connector</div><div class="desc"></div><span id="iniflexApiBadge"></span><div id="iniflexApiBody"></div></div>
