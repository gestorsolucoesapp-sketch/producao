<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Executor controlado Iniflex</title>
<style>
:root{--navy:#0b3154;--light:#eef3f7}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--light);font-family:Arial,sans-serif;color:var(--navy)}.wrap{max-width:1050px;margin:auto}.box{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0002}#remoteStatus{padding:12px 14px;border-radius:10px;background:#fff4d6;font-weight:800;margin-bottom:14px;white-space:pre-line}#iniflexApiCard{background:#fff;border-left:4px solid #08a357;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001}.titulo-sec{font-size:18px;font-weight:800}.desc{font-size:13px;color:#607080;margin-top:4px}.btn{padding:10px 13px;border:0;border-radius:8px;font-weight:800}.btn-borda{background:#e9eef3;color:var(--navy)}.btn-verde{background:#08783e;color:#fff}
</style>
</head>
<body><main class="wrap"><div class="box">
<div style="font-size:20px;font-weight:900">Executor controlado dos relatórios Iniflex</div>
<div class="desc">Prepara, valida, processa, envia e importa um relatório por vez. Só avança depois da conclusão do anterior.</div>
<div id="remoteStatus">Aguardando a extensão v0.8.3…</div>
<section id="iniflexApiCard"><div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div><div class="desc">Aguardando a extensão carregar…</div><div id="iniflexApiBody"></div></section>
</div></main>
<script>
(()=>{
 const p=new URLSearchParams(location.search),map={RPCP621:'621',RPCP622:'622',RPCP624:'624',RPCP054:'054',RPCP643:'643',RPCP646:'646',RSMI005:'005',RSMI010:'010',REST196:'196',REST241:'241',RGER339:'339',RVEN002:'002','RVEN304-PED':'304-PED','RVEN304-PROP':'304-PROP'};
 const raw=(p.get('ids')||p.get('code')||'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean),ids=raw.map(x=>map[x]||x).filter(x=>/^(621|622|624|054|643|646|005|010|196|241|339|002|304-PED|304-PROP)$/.test(x));
 const nonce=p.get('nonce')||ids.join('-')||String(Date.now()),key='rio-controlled-sequence:'+nonce,status=document.getElementById('remoteStatus');
 let state;try{state=JSON.parse(sessionStorage.getItem(key)||'null')}catch(_){state=null}
 if(!state||!Array.isArray(state.ids)||state.ids.join(',')!==ids.join(','))state={ids,index:0,phase:'prepare',clickedAt:0,done:[],errors:[],reloads:0};
 const save=()=>sessionStorage.setItem(key,JSON.stringify(state)),current=()=>state.ids[state.index]||null,setStatus=t=>status.textContent=t;
 const output=()=>String(document.getElementById('rioOut')?.textContent||'').trim();
 const preparedText=()=>[...document.querySelectorAll('#iniflexApiBody *')].map(e=>e.textContent||'').find(t=>/preparado no Iniflex/i.test(t))||'';
 const reportButton=id=>document.querySelector('.rioOne[data-id="'+CSS.escape(id)+'"]');
 const reloadSoon=(ms=1200)=>setTimeout(()=>location.reload(),ms);
 const next=()=>{state.index++;state.phase='prepare';state.clickedAt=0;state.reloads=0;save();reloadSoon(500)};
 function tick(){
   if(!ids.length){setStatus('Nenhum relatório válido informado.');return}
   const id=current();if(!id){setStatus('✅ Sequência concluída: '+state.done.join(' → '));save();return}
   const out=output(),processBtn=document.getElementById('rioProcessPrepared'),cancelBtn=document.getElementById('rioCancelPrepared'),prep=preparedText(),elapsed=Date.now()-Number(state.clickedAt||0);
   if(/Extension context invalidated/i.test(out)){setStatus('Reconectando a extensão após reinício do worker…');reloadSoon(700);return}
   if(state.phase==='prepare'){
     if(processBtn){
       if(prep.includes(id)||prep.includes(id.replace('-PED','').replace('-PROP',''))){state.phase='process';state.clickedAt=Date.now();save();setStatus('✅ '+id+' preparado. Clicando em Processar…');processBtn.click();return}
       if(cancelBtn){setStatus('Limpando preparação anterior antes de '+id+'…');cancelBtn.click();reloadSoon(1200);return}
     }
     const btn=reportButton(id);
     if(btn&&!btn.disabled){state.phase='waiting';state.clickedAt=Date.now();save();setStatus('⏳ Preparando '+id+' ('+(state.index+1)+'/'+ids.length+')…');setTimeout(()=>btn.click(),50);reloadSoon(1800);return}
     setStatus('Aguardando o conector disponibilizar '+id+'…');return;
   }
   if(state.phase==='waiting'){
     if(processBtn&&(prep.includes(id)||prep.includes(id.replace('-PED','').replace('-PROP','')))){state.phase='process';state.clickedAt=Date.now();save();setStatus('✅ '+id+' preparado. Clicando em Processar…');processBtn.click();return}
     setStatus('⏳ A extensão está preparando '+id+' na tela do Iniflex…');
     if(elapsed>7000){state.reloads=(state.reloads||0)+1;save();reloadSoon(300);}
     return;
   }
   if(state.phase==='process'){
     setStatus('⏳ '+id+' está gerando/importando. Não feche o Iniflex.\n'+out);
     if(/❌|não foi possível|falha|erro/i.test(out)&&elapsed>3500){state.errors.push({id,message:out,at:new Date().toISOString()});state.phase='prepare';state.clickedAt=0;save();setStatus('⚠️ '+id+' falhou; nova tentativa automática…');reloadSoon(1200);return}
     if(!processBtn&&elapsed>4000&&(/Última execução:\s*1\/1 concluídos/i.test(out)||/✅ Comando concluído/i.test(out))){state.done.push(id);save();setStatus('✅ '+id+' concluído. Avançando…');next();return}
     if(elapsed>35*60*1000){state.errors.push({id,message:'tempo limite',at:new Date().toISOString()});state.phase='prepare';state.clickedAt=0;save();reloadSoon(1000);}
   }
 }
 save();setInterval(tick,1000);tick();
})();
</script></body></html>
