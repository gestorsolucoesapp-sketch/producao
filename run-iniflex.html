<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Executor Iniflex Rioplastic</title>
  <style>
    :root{--leve-2:#eef3f8;--fraco:#607080}
    *{box-sizing:border-box}
    body{margin:0;padding:28px;background:#e8eef4;color:#0b3154;font-family:Arial,sans-serif}
    .wrap{max-width:1050px;margin:auto}
    #remoteStatus{margin:0 0 14px;padding:12px 15px;border-radius:10px;background:#fff;font-weight:700;box-shadow:0 2px 10px #0001}
    #iniflexApiCard{background:#fff;border-left:4px solid #08a357;border-radius:14px;padding:18px;box-shadow:0 2px 12px #0001}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .titulo-sec{font-size:18px;font-weight:800}.desc{font-size:13px;color:#607080;margin-top:4px}
    #iniflexApiBadge{padding:7px 12px;border-radius:999px;font-size:12px;font-weight:800;background:#eef3f8}
    .btn{border:0;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer;font-size:14px}
    .btn-verde{background:#00a651;color:#fff}.btn-borda{background:#fff;color:#0b3154;border:1px solid #ccd7e1}
  </style>
</head>
<body>
  <main class="wrap">
    <div id="remoteStatus">Preparando comando do Iniflex…</div>
    <section id="iniflexApiCard">
      <div class="head">
        <div>
          <div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div>
          <div class="desc">Aguardando a extensão carregar…</div>
        </div>
        <div id="iniflexApiBadge">verificando…</div>
      </div>
      <div id="iniflexApiBody"></div>
    </section>
  </main>
  <script>
  (()=>{
    const p=new URLSearchParams(location.search);
    const code=String(p.get('code')||'').toUpperCase();
    const nonce=String(p.get('nonce')||code||Date.now());
    const allowed=/^RPCP(?:621|622|624|054|643|646)$/.test(code)||code==='ALL';
    const status=document.getElementById('remoteStatus');
    if(!allowed){status.textContent='Comando inválido: '+code;return}
    const key='rio-iniflex-run:'+nonce;
    if(sessionStorage.getItem(key)==='done'){
      status.textContent='Comando '+code+' já foi enviado nesta aba.';
      return;
    }
    let attempts=0;
    const timer=setInterval(()=>{
      const btn=code==='ALL'
        ?document.getElementById('rioAll')
        :document.querySelector('.rioOne[data-code="'+code+'"]');
      if(btn&&!btn.disabled){
        sessionStorage.setItem(key,'done');
        status.textContent='Comando '+code+' enviado. Aguardando geração, upload e importação…';
        btn.click();
        clearInterval(timer);
        return;
      }
      attempts++;
      status.textContent='Aguardando o conector ficar pronto para '+code+'…';
      if(attempts>180){
        clearInterval(timer);
        status.textContent='O conector não ficou pronto em 90 segundos.';
      }
    },500);
  })();
  </script>
</body>
</html>
