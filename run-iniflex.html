<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate"><title>Executor comercial Iniflex</title><style>body{margin:0;padding:24px;background:#eef3f7;font-family:Arial;color:#0b3154}.box{max-width:920px;margin:auto;background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 16px #0002}#s{padding:12px;border-radius:10px;background:#fff4d6;font-weight:800;white-space:pre-line}.titulo-sec{font-size:18px;font-weight:800}.desc{font-size:13px;color:#607080}.btn{padding:10px 13px;border:0;border-radius:8px;font-weight:800}.btn-borda{background:#e9eef3}.btn-verde{background:#08783e;color:#fff}#iniflexApiCard{margin-top:14px}</style></head><body><main class="box"><h2>Executor comercial Iniflex</h2><div id="s">Inicializando…</div><section id="iniflexApiCard"><div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div><div class="desc">Aguardando o conector…</div><div id="iniflexApiBody"></div></section></main><script>
(()=>{
 const ACTIVE='final-commercial-20260924-1305',nonce=new URLSearchParams(location.search).get('nonce')||'';
 const s=document.getElementById('s');
 if(nonce!==ACTIVE){s.textContent='⏸️ Esta aba antiga foi desativada para não concorrer com a execução comercial.';document.getElementById('iniflexApiCard').remove();return}
 const ids=['304-PED','304-PROP','002'],key='final-commercial-v1-'+ACTIVE;
 let st;try{st=JSON.parse(localStorage.getItem(key)||'null')}catch(_){st=null}
 if(!st||!Array.isArray(st.ids)||st.ids.join(',')!==ids.join(','))st={ids,index:0,phase:'prepare',at:0,done:[],tries:{},lastProcess:0};
 const save=()=>localStorage.setItem(key,JSON.stringify(st)),id=()=>st.ids[st.index]||null,out=()=>String(document.getElementById('rioOut')?.textContent||''),prep=()=>[...document.querySelectorAll('#iniflexApiBody *')].map(e=>String(e.textContent||'')).find(t=>/preparado no Iniflex/i.test(t))||'',btn=x=>document.querySelector('.rioOne[data-id="'+CSS.escape(x)+'"]');
 const set=t=>s.textContent=t,reload=(ms=1200)=>setTimeout(()=>location.reload(),ms);
 function match(x,t){t=String(t).toUpperCase();if(t.includes(x))return true;if(x==='304-PED')return t.includes('304')&&t.includes('PEDIDO');if(x==='304-PROP')return t.includes('304')&&t.includes('PROPOSTA');if(x==='002')return t.includes('002');return false}
 function retry(x,m){st.tries[x]=(st.tries[x]||0)+1;st.phase='prepare';st.at=0;st.lastProcess=0;save();set('⚠️ '+x+' falhou. Nova tentativa '+st.tries[x]+'.\n'+m);reload(Math.min(15000,2500+st.tries[x]*1000))}
 function next(x){if(!st.done.includes(x))st.done.push(x);st.index++;st.phase='prepare';st.at=0;st.lastProcess=0;save();reload(900)}
 function tick(){
   const x=id();if(!x){set('✅ 100% COMERCIAL CONCLUÍDO: '+st.done.join(' → '));save();return}
   const o=out(),p=prep(),proc=document.getElementById('rioProcessPrepared'),cancel=document.getElementById('rioCancelPrepared'),elapsed=Date.now()-(st.at||0);
   if(/Extension context invalidated|Conector reiniciou/i.test(o)){set('🔄 Reconectando o conector…');reload(1400);return}
   if(st.phase==='prepare'){
     if(proc){if(match(x,p)){st.phase='process';st.at=Date.now();st.lastProcess=Date.now();save();set('✅ '+x+' preparado. Processando…');proc.click();return}if(cancel){set('Limpando preparação anterior antes de '+x+'…');cancel.click();reload(1800);return}}
     const b=btn(x);if(b&&!b.disabled){st.phase='waiting';st.at=Date.now();save();set('⏳ Preparando '+x+' ('+(st.index+1)+'/3)…');b.click();reload(3200);return}
     set('Aguardando o conector v0.8.4 para '+x+'…');if(elapsed>15000)reload();return
   }
   if(st.phase==='waiting'){
     if(proc&&match(x,p)){st.phase='process';st.at=Date.now();st.lastProcess=Date.now();save();set('✅ '+x+' validado. Processando…');proc.click();return}
     if(/^(⚠️|❌)|não foi possível|falha|erro|rejeitou|bloqueou/i.test(o)&&elapsed>5000){retry(x,o);return}
     set('⏳ Preparando '+x+' na tela do Iniflex…\n'+o);if(elapsed>45000){st.phase='prepare';st.at=0;save();reload()}return
   }
   if(st.phase==='process'){
     set('⏳ '+x+' gerando, enviando e importando…\n'+o);
     if(/Comando concluído|Última execução:\s*1\/1 concluíd/i.test(o)&&elapsed>3000){next(x);return}
     if(/^(⚠️|❌)|não foi possível|falha|erro|rejeitou|bloqueou|divergente/i.test(o)&&elapsed>7000){retry(x,o);return}
     if(proc&&match(x,p)&&Date.now()-Number(st.lastProcess||0)>20000){st.lastProcess=Date.now();save();set('🔁 Retomando Processar de '+x+' após reconexão…');proc.click();return}
     if(elapsed>50*60*1000){retry(x,'tempo limite');return}
   }
 }
 save();setInterval(tick,1000);tick();
})();
</script></body></html>
