<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Executar RVEN002</title><style>body{font-family:Arial;background:#eef3f7;color:#0b3154;padding:24px}.box{max-width:820px;margin:auto;background:white;border-radius:14px;padding:20px;box-shadow:0 3px 16px #0002}#status{padding:12px;background:#fff4d6;border-radius:10px;font-weight:800}.titulo-sec{font-size:18px;font-weight:800}.desc{font-size:13px;color:#607080}.btn{padding:9px 12px;border:0;border-radius:8px;font-weight:800}.btn-borda{background:#e9eef3}.btn-verde{background:#08783e;color:#fff}</style></head><body><div class="box"><h2>Teste controlado RVEN002 · Pedido</h2><div id="status">Aguardando o conector v0.8.4…</div><section id="iniflexApiCard" style="margin-top:14px"><div class="titulo-sec">🔌 INIFLEX · CONECTOR LOCAL</div><div class="desc">Aguardando a extensão…</div><span id="iniflexApiBadge"></span><div id="iniflexApiBody"></div></section></div><script>
(()=>{const st=document.getElementById('status');let clicked=false,processed=false;function tick(){try{const out=String(document.getElementById('rioOut')?.textContent||'');const prep=[...document.querySelectorAll('#iniflexApiBody *')].map(e=>e.textContent||'').find(t=>/002 preparado no Iniflex/i.test(t));const process=document.getElementById('rioProcessPrepared');if(prep&&process&&!processed){processed=true;st.textContent='✅ 002 preparado; acionando Processar.';process.click();return}if(/Última execução:\s*1\/1 concluídos/i.test(out)){st.textContent='✅ RVEN002 concluído e importado.';return}if(/❌|falha|erro/i.test(out)){st.textContent='⚠️ '+out;return}const btn=document.querySelector('.rioOne[data-id="002"]');if(btn&&!clicked){clicked=true;st.textContent='⏳ Preparando somente o RVEN002 na tela do Iniflex…';btn.click();return}st.textContent=clicked?'⏳ Aguardando a preparação do RVEN002…':'Aguardando o conector v0.8.4…'}catch(e){st.textContent='Erro da página: '+e.message}}setInterval(tick,1000);tick()})();
</script></body></html>
